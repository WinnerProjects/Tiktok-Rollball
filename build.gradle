plugins {
    id 'fabric-loom' version '1.14.10' apply false
}

subprojects {
    configurations.all {
            resolutionStrategy.capabilitiesResolution.withCapability("com.github.tacowasa059:common") {
                        def localProj = candidates.find { it.id.toString().contains("project :common") }
                                    if (localProj != null) {
                                                    select(localProj)
                                                                } else {
                                                                                selectHighestVersion()
                                                                                            }
                                                                                                    }
                                                                                                        }
                                                                                                        }